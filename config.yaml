# ─── إعدادات مرنان — النموذج الفيزيائي ───
# كل المعاملات هنا تتحكم في سلوك المحرك الفيزيائي أثناء التوليد والتدريب.
# يمكن تعديلها دون تغيير الكود.

# ═══ معامل ألفا — خلط السياق في المتجه الطوري ═══
# كلما زاد alpha، زاد تأثير السياق المحيط على معنى الكلمة.
# القيمة الأصلية: 0.3 — نرفعها لـ 0.5 لدقة أعلى.
alpha: 0.5

# ═══ DCCF — حقل الاقتران الديناميكي السياقي (بديل self-attention) ═══
dccf:
  decay_rate: 0.5          # سرعة اضمحلال تأثير الكلمات البعيدة
  mass_threshold: 0.3       # عتبة التوافق الطوري الأدنى

# ═══ PotentialCascade — طبقة الهوي التراكمي ═══
cascade:
  enabled: false            # تفعيل/تعطيل الهوي التراكمي
  lambda_cascade: 3.0       # شدة طبقة الهوي
  gamma: 2.0                # أس اضمحلال المسافة (2.0 ≈ جاذبية)
  delta: 0.3                # ثابت تجنب التفرد
  phase_lock_threshold: 0.65
  repulsion_strength: 2.5
  friction_decay: 0.3

# ═══ PhaseReinforcement — التعزيز الطوري الذاتي ═══
phase_reinforcement:
  learning_rate: 0.05       # سرعة التعلم الطوري
  decay: 0.01               # اضمحلال التعزيز

# ═══ PromptField — تعديل الطور بالأمر ═══
prompt_field:
  decay_rate: 0.1
  strength: 1.0

# ═══ EntropyGate — بوابة الإنتروبيا ═══
entropy:
  S_crit: 1.0               # العتبة الحرجة للإنتروبيا

# ═══ معاملات التوليد ═══
generation:
  beam_width: 5
  top_k: 500
  beta: 2.0                 # ثابت بولتزمان للتنشيط الطوري
  # seed: 42                # بذرة عشوائية — محذوفة عمداً لتوليد فريد كل مرة
  relaxation_enabled: false   # تفعيل توليد الاسترخاء الرنيني
  relaxation_passes: 3       # عدد ممرات الاسترخاء

# ═══ معايرة الرنين — ضبط ذاتي للأوزان ═══
calibration:
  lr: 0.02                   # معدل تعلم المعايرة
  min_samples: 50            # الحد الأدنى لعينات التدريب
  max_iterations: 10         # أقصى عدد جولات
  convergence: 0.001          # عتبة التقارب

# ═══ تطور المتجهات الطورية — تنظيم ذاتي ═══
phase_evolution:
  lr_cooc: 0.01              # معدل تعلم المزامنة الهيبيانية
  lr_contrast: 0.005         # معدل تعلم التباين
  lr_spectral: 0.008         # معدل تعلم الإزاحة الطيفية
  min_cooc: 3                # الحد الأدنى للتشارك
  max_shift: 0.1             # أقصى إزاحة للمتجه

# ═══ مشهد القصد — آبار جهد محتمل ═══
intent_landscape:
  adaptation_rate: 0.01      # معدل تكييف الآبار

# ═══ أثر التفاعل — حقل مستمر ═══
interaction_trace:
  decay_rate: 0.95          # معدل اضمحلال الحقل
  max_attractors: 50         # أقصى عدد مناطق الجذب
  learning_rate: 0.05       # معدل تعلم الحقل

# ═══ الذاكرة الهرمية — ضغط السياق ═══
hierarchical_memory:
  word_capacity: 100         # سعة مستوى الكلمة
  phrase_capacity: 40        # سعة مستوى العبارة
  paragraph_capacity: 15     # سعة مستوى الفقرة
  conversation_capacity: 5   # سعة مستوى المحادثة

# ═══ أوزان التسجيل — تتحكم في مساهمة كل مكوّن فيزيائي ═══
# هذه الأوزان الخام (raw weights) تُطبَّع تلقائياً بحيث مجموعها ≈ 0.95
scoring_weights:
  # ═══ الأساسيات العشرة (فعالة) ═══
  align: 3.0                # التوافق الطوري — أساس كل شيء
  prompt_align: 2.5         # التوافق مع الأمر
  syntax: 5.0               # النحو — يمنع الركاكة
  gravity: 2.5              # الجاذبية الدلالية الإقليدية
  beamform: 3.0             # تشكيل الشعاع الطوري (بديل Self-Attention)
  refractory: 2.5           # بوابة الجموح (بديل Repetition Penalty)
  macro_wave: 2.0           # تشابك الموجات الكبرى (بديل الطبقات العميقة)
  heterodyne: 3.0           # التغاير الترددي — عزل رفقاء السياق
  carrier: 4.0              # الموجة الحاملة — طيف الرفيقات الكامل لكل كلمة
  resonant_chain: 4.0       # السلسلة الرنينية LC
  k_coupling: 3.0           # مصفوفة التلازم K (syn+sem+conc مدمجة)
  diversity: 1.0            # التنوع — يمنع التكرار
  repulsion: 0.5            # التنافر — كسر التشابه
  morpho: 1.5               # الصرف العربي (morpho_trans ضمنياً)

  # ═══ معطلة (تُفعّل حسب الحاجة) ═══
  resonance_gate: 0.0       # بوابة الرنين
  symbolic: 0.0             # القواعد الرمزية
  morpho_trans: 0.0         # انتقالات صرفية
  sentence: 0.0             # بنية الجملة
  pos_alt: 0.0              # تناوب أقسام الكلام
  irab: 0.0                 # الإعراب
  syntax_gate: 0.0          # بوابة النحو
  syntax_phase: 0.0         # الطور النحوي
  phil_semantic: 0.0        # الدلالة الفلسفية
  root_align: 0.0           # توافق الجذر
  ram_plan: 0.0             # ذاكرة الجذب
  oscillator: 0.0           # مذبذبات كوراموتو (بطيئة)
  pragmatic: 0.0            # البراغماتية
  weight_resonance: 0.0     # رنين الأوزان الصرفية
  poetic: 0.0               # الشعرية (فقط في النمط الشعري)
  rhyme: 0.0                # القافية (فقط في النمط الشعري)
  spectral: 0.0             # الطيفي
  thermo: 0.0               # الحراري
  dialogue_gravity: 0.0     # جاذبية الحوار
  dialogue_spectral: 0.0    # طيف الحوار
  intent_align: 0.0         # توافق القصد
  associative_plan: 0.0     # الخطة الترابطية
  entity_align: 0.0         # توافق الكيانات
  plan_fidelity: 0.0        # إخلاص الخطة
  sentiment: 0.0            # المشاعر
  anchor_affinity: 0.0      # ألفة المرساة
  semantic_density: 0.0     # الكثافة الدلالية
  novelty: 0.0              # الجدّة
  relational_resonance: 0.0 # الرنين العلائقي
  context_wave_filter: 0.0  # مرشح الموجة السياقية
  eng_morpho: 0.0           # صرف إنجليزي
  eng_morpho_trans: 0.0     # انتقالات صرفية إنجليزية
  eng_grammar: 0.0          # نحو إنجليزي
  eng_agreement: 0.0        # تطابق إنجليزي
  eng_stem_align: 0.0       # توافق الجذع الإنجليزي
  global_resonance: 0.0     # الرنين الشامل
  phase_opposition: 0.0     # التعارض الطوري
  syn: 0.0                  # K_syn (مدمج في k_coupling)
  sem: 0.0                  # K_sem (مدمج في k_coupling)
  conc: 0.0                 # K_conc (مدمج في k_coupling)
  causal: 2.00               # السببية (مُفعَّلة V8)
  dccf: 3.0                 # DCCF — بديل self-attention (مُفعَّل)
  ppm: 0.0                  # تعديل الطور
  amfs: 0.0                 # التحول التكيفي
  cascade: 0.0              # الهوي التراكمي
  dialogue: 0.0             # الحوار
  category: 0.0             # التصنيف الدلالي
  contextual_spectra: 0.0   # الأطياف السياقية
  trajectory: 0.0           # مسار الطور
  hierarchical: 0.0         # الذاكرة الهرمية
  intent_landscape: 0.0     # مشهد القصد
  trace: 0.0                # أثر التفاعل
  relational: 0.0           # K علاقية
  architect: 0.0            # بناء معماري للرد
  dialogue: 3.00            # الحوار
  category: 1.50            # التصنيف الدلالي
  contextual_spectra: 10.00 # الأطياف السياقية
  trajectory: 1.50           # مسار الطور (معالم التوليد)
  hierarchical: 1.20         # الذاكرة الهرمية
  intent_landscape: 1.50     # مشهد القصد
  trace: 0.50               # أثر التفاعل
  relational: 1.00           # K علاقية
  architect: 3.00             # بناء معماري للرد
  density_resonance: 3.00   # V8: رنين مصفوفة الكثافة الكمومية
  partonic_cross: 2.00      # V8: فصل الأطوار الجسيمي (cross-coherence)
  causal_flow_align: 2.50   # V8: محاذاة حقل التدفق السببي
  hierarchical_mod: 2.00    # V8: تعديل هرمي موجي AM/FM

# ═══ محرك التغاير الترددي (Heterodyne) ═══
heterodyne:
  bandwidth: 0.15            # عرض نطاق التطابق الترددي
  context_window: 8          # نافذة السياق للتحليل الترددي

# ═══ التدريب — بناء مصفوفات K ═══
training:
  window_sem: 10             # نافذة K_sem — موسّعة لطلاقة أفضل
  window_syn: 4              # نافذة K_syn — موسّعة لطلاقة أفضل
  window_dial: 2             # نافذة K_dialogue
  particle_weight: 0.15      # وزن الحروف النحوية في K
  spectral_half_window: 7    # نصف نافذة الذاكرة الطيفية
  causal_window: 5           # نافذة السببية

# ═══ الوضع الإبداعي (Creative Mode) ═══
creative:
  tau: 1.2                   # حرارة Boltzmann عالية (مزيد من التنوع)
  beam_width: 8              # شعاع أوسع للاستكشاف
  tunnel_prob: 0.05          # احتمال النفق الكمومي (قفز مجازي)
  perturbation: 0.15         # شدة الاضطراب الطوري
  quantum_capacity: 25       # سعة التراكب الكمومي

# ═══ V8: مصفوفة الكثافة الكمومية — بديل متوسط المتجهات ═══
density_matrix:
  decay_rate: 0.8             # سرعة اضمحلال الأهمية الموضعية

# ═══ V8: حقل التدفق السببي — استدلال منطقي مستمر ═══
causal_flow:
  strength: 1.0               # شدة تيار التدفق (γ)
  transitive_depth: 3         # عمق الاستدلال التعددي
