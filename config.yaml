# ─── إعدادات مرنان — النموذج الفيزيائي ───
# كل المعاملات هنا تتحكم في سلوك المحرك الفيزيائي أثناء التوليد والتدريب.
# يمكن تعديلها دون تغيير الكود.

# ═══ فضاء الاندماج الهندسي وكليفورد ═══
semantic_fusion:
  method: "projection"       # جداء كليفورد الهندسي (بدل المتوسط الخطي الخاطئ)
  vowel_modulation: true     # تفعيل تعديل الحركات بنصف قيمة حرف المد
  regularize: true           # تفعيل الانتظام الهندسي لتفادي أصفار الرتب الدلالية



# ═══ معامل ألفا — خلط السياق في المتجه الطوري ═══
# كلما زاد alpha، زاد تأثير السياق المحيط على معنى الكلمة.
# القيمة الأصلية: 0.3 — نرفعها لـ 0.5 لدقة أعلى.
alpha: 0.5

# ═══ DCCF — حقل الاقتران الديناميكي السياقي (بديل self-attention) ═══
dccf:
  decay_rate: 0.5          # سرعة اضمحلال تأثير الكلمات البعيدة
  mass_threshold: 0.3       # عتبة التوافق الطوري الأدنى

# ═══ PotentialCascade — طبقة الهوي التراكمي ═══
cascade:
  enabled: true             # تفعيل الهوي التراكمي — يمنع الانفلات الدلالي
  lambda_cascade: 3.0       # شدة طبقة الهوي
  gamma: 2.0                # أس اضمحلال المسافة (2.0 ≈ جاذبية)
  delta: 0.3                # ثابت تجنب التفرد
  phase_lock_threshold: 0.65
  repulsion_strength: 2.5
  friction_decay: 0.3

# ═══ PhaseReinforcement — التعزيز الطوري الذاتي ═══
phase_reinforcement:
  learning_rate: 0.05       # سرعة التعلم الطوري
  decay: 0.01               # اضمحلال التعزيز

# ═══ PromptField — تعديل الطور بالأمر ═══
prompt_field:
  decay_rate: 0.1
  strength: 1.0

# ═══ EntropyGate — بوابة الإنتروبيا ═══
entropy:
  S_crit: 1.0               # العتبة الحرجة للإنتروبيا

# ═══ معاملات التوليد ═══
generation:
  beam_width: 5
  top_k: 500
  beta: 2.0                 # ثابت بولتزمان للتنشيط الطوري
  # seed: 42                # بذرة عشوائية — محذوفة عمداً لتوليد فريد كل مرة
  relaxation_enabled: true    # تفعيل توليد الاسترخاء الرنيني (تحسين متعدد الممرات)
  relaxation_passes: 3       # عدد ممرات الاسترخاء

# ═══ معايرة الرنين — ضبط ذاتي للأوزان ═══
calibration:
  lr: 0.02                   # معدل تعلم المعايرة
  min_samples: 50            # الحد الأدنى لعينات التدريب
  max_iterations: 10         # أقصى عدد جولات
  convergence: 0.001          # عتبة التقارب

# ═══ تطور المتجهات الطورية — تنظيم ذاتي ═══
phase_evolution:
  lr_cooc: 0.03              # معدل تعلم المزامنة الهيبيانية (كان 0.01)
  lr_contrast: 0.015         # معدل تعلم التباين (كان 0.005)
  lr_spectral: 0.02          # معدل تعلم الإزاحة الطيفية (كان 0.008)
  min_cooc: 2                # الحد الأدنى للتشارك (كان 3)
  max_shift: 0.25             # أقصى إزاحة للمتجه (كان 0.1)

# ═══ مشهد القصد — آبار جهد محتمل ═══
intent_landscape:
  adaptation_rate: 0.01      # معدل تكييف الآبار

# ═══ أثر التفاعل — حقل مستمر ═══
interaction_trace:
  decay_rate: 0.95          # معدل اضمحلال الحقل
  max_attractors: 50         # أقصى عدد مناطق الجذب
  learning_rate: 0.05       # معدل تعلم الحقل

# ═══ الذاكرة الهرمية — ضغط السياق ═══
hierarchical_memory:
  word_capacity: 100         # سعة مستوى الكلمة
  phrase_capacity: 40        # سعة مستوى العبارة
  paragraph_capacity: 15     # سعة مستوى الفقرة
  conversation_capacity: 5   # سعة مستوى المحادثة

# ═══ أوزان التسجيل — فيزيائية بحتة (بدون K-matrix إحصائي) ═══
# هذه الأوزان الخام (raw weights) تُطبَّع تلقائياً بحيث مجموعها ≈ 0.95
scoring_weights:
  # ═══ الأساسيات الفيزيائية — نواة التوليد ═══
  align: 5.0                # التوافق الطوري — أساس كل شيء (cosine similarity في فضاء 56D)
  gravity: 5.0              # الجاذبية الدلالية F=G·m₁·m₂/r² — تجاذب الكتل في فضاء الطور
  resonant_chain: 5.0       # السلسلة الرنينية LC — ترددات الأزواج المتجاورة
  oscillator: 3.0           # مذبذبات كوراموتو — تزامن الأطوار عبر محاكاة 20 خطوة
  heterodyne: 4.0           # التغاير الترددي الصافي — f_plus/f_minus بدون K
  beamform: 3.5             # تشكيل الشعاع الطوري — تركيز الحقل على المرشحين الأقوى
  mizan_coherence: 3.0      # محرك اتساق الميزان — قوة الفاعل vs مقاومة المفعول
  dccf: 4.0                 # حقل الاقتران السياقي الديناميكي — coupling + اضمحلال
  causal_flow_align: 3.0    # محاذاة حقل التدفق السببي — استدلال منطقي مستمر
  partonic_cross: 2.5       # فصل الأطوار الجسيمي — نواة دلالية vs غلاف طيفي
  density_resonance: 3.0    # رنين مصفوفة الكثافة الكمومية ρ = Σ pᵢ|ψᵢ⟩⟨ψᵢ|
  hierarchical_mod: 2.5     # تعديل هرمي موجي AM/FM — 4 مستويات ضغط طيفي
  prompt_align: 3.0         # التوافق مع الأمر — محاذاة الطور مع prompt
  constraint_align: 4.0     # قيد Dirichlet — prompt كشروط حدودية
  kb_knowledge: 2.5         # ذاكرة هولوغرافية معرفية — استرجاع حقائق

  # ═══ نحوية وصرفية ═══
  syntax: 5.0               # النحو — انتقالات bigram في SyntaxField
  syntax_gate: 2.5          # بوابة النحو — استقرار الانتقال النحوي
  syntax_phase: 2.5         # الطور النحوي — SyntaxTransitionField.gate()
  morpho: 1.5               # الصرف العربي
  morpho_trans: 1.2         # انتقالات صرفية
  irab: 1.5                 # الإعراب — توافق حالات الرفع والنصب والجر
  weight_resonance: 1.5     # رنين الأوزان الصرفية العربية الـ14
  sentence: 1.0             # بنية الجملة — موقع الكلمة بداية/وسط/نهاية
  pos_alt: 1.0              # تناوب أقسام الكلام — منع تتابع نفس النوع
  phil_semantic: 2.0        # الدلالة الفلسفية — أبعاد 42-64
  root_align: 1.2           # توافق الجذر الثلاثي
  pragmatic: 1.5            # البراغماتية — إطار القصد + تعارض الطور

  # ═══ تنوع وإيقاع ═══
  diversity: 1.0            # التنوع — منع التكرار
  repulsion: 0.8            # التنافر — كسر التشابه مع الكلمات السابقة
  novelty: 0.5              # الجدّة — مكافأة الكلمات الجديدة
  spectral: 2.0             # الطيفي — رنين طيفي بين الكلمات
  thermo: 1.5               # الحراري — بوابة حرارية Boltzmann
  phase_opposition: 1.5     # التعارض الطوري

  # ═══ حوارية ═══
  dialogue: 3.0             # الحوار — anti-completion + sentence starter bonus
  dialogue_gravity: 2.5     # جاذبية الحوار — ذاكرة حوارية مضغوطة طورياً
  dialogue_spectral: 2.0    # طيف الحوار — رنين سياقي مع تاريخ الحوار
  intent_align: 3.0         # توافق القصد — محاذاة مع intent vector
  associative_plan: 3.5     # الخطة الترابطية — associative memory retrieval
  entity_align: 2.0         # توافق الكيانات
  plan_fidelity: 4.0        # إخلاص الخطة — ResponsePlanner target
  architect: 3.0            # بناء معماري للرد — توجيه مراحل الرد
  trajectory: 1.5           # مسار الطور — معالم التوليد
  hierarchical: 1.5         # الذاكرة الهرمية — 4 مستويات ضغط السياق
  intent_landscape: 1.5     # مشهد القصد — آبار جهد محتمل
  trace: 0.8                # أثر التفاعل — أنماط المستخدم

  # ═══ ذاكرة وسياق ═══
  ram_plan: 1.5             # ذاكرة الجذب — RAM attractor memory
  global_resonance: 2.0     # الرنين الشامل — GlobalSpectralMemory
  contextual_spectra: 5.0   # الأطياف السياقية — حقول دلالية من phase vectors
  context_wave_filter: 2.0  # مرشح الموجة السياقية — adaptive_context_filter
  relational: 1.0           # K علاقية — استخراج نسب محددة
  category: 2.0             # التصنيف الدلالي — فئات الكلمات
  sentiment: 1.0            # المشاعر
  anchor_affinity: 2.0      # ألفة المرساة
  semantic_density: 2.0     # الكثافة الدلالية

  # ═══ إنجليزية ═══
  eng_morpho: 1.0           # صرف إنجليزي
  eng_morpho_trans: 0.8     # انتقالات صرفية إنجليزية
  eng_grammar: 1.0          # نحو إنجليزي
  eng_agreement: 0.8        # تطابق إنجليزي
  eng_stem_align: 0.8       # توافق الجذع الإنجليزي

  # ═══ تحسينات متقدمة ═══
  causal: 2.5               # السببية — CausalPhaseEngine
  ppm: 2.0                  # تعديل الطور بالأمر PromptField
  amfs: 1.5                 # التحول التكيفي — Adaptive Mass & Frequency Shift
  cascade: 0.0              # الهوي التراكمي — مفعّل يدوياً فقط
  carrier: 3.0              # الموجة الحاملة — طيف الرفيقات
  macro_wave: 2.0           # تشابك الموجات الكبرى (في creative mode)
  refractory: 2.5           # بوابة الجموح (في creative mode)
  resonance_gate: 2.0       # بوابة الرنين — تنشيط انتقائي

  # ═══ K-matrix إحصائي — مُصفّر بالكامل ═══
  k_coupling: 3.0           # مصفوفة التلازم K
  syn: 3.0                  # K_syn
  sem: 3.0                  # K_sem
  conc: 1.5                 # K_conc

  # ═══ معطلة (تُفعّل حسب الحاجة) ═══
  symbolic: 0.0             # القواعد الرمزية
  poetic: 0.0               # الشعرية (فقط في النمط الشعري)
  rhyme: 0.0                # القافية (فقط في النمط الشعري)

# ═══ محرك التغاير الترددي (Heterodyne) ═══
heterodyne:
  bandwidth: 0.15            # عرض نطاق التطابق الترددي
  context_window: 8          # نافذة السياق للتحليل الترددي

# ═══ التدريب — بناء مصفوفات K ═══
training:
  window_sem: 10             # نافذة K_sem — موسّعة لطلاقة أفضل
  window_syn: 4              # نافذة K_syn — موسّعة لطلاقة أفضل
  window_dial: 2             # نافذة K_dialogue
  particle_weight: 0.15      # وزن الحروف النحوية في K
  spectral_half_window: 7    # نصف نافذة الذاكرة الطيفية
  causal_window: 5           # نافذة السببية

# ═══ الوضع الإبداعي (Creative Mode) ═══
creative:
  tau: 1.2                   # حرارة Boltzmann عالية (مزيد من التنوع)
  beam_width: 8              # شعاع أوسع للاستكشاف
  tunnel_prob: 0.05          # احتمال النفق الكمومي (قفز مجازي)
  perturbation: 0.15         # شدة الاضطراب الطوري
  quantum_capacity: 25       # سعة التراكب الكمومي

# ═══ V8: مصفوفة الكثافة الكمومية — بديل متوسط المتجهات ═══
density_matrix:
  decay_rate: 0.8             # سرعة اضمحلال الأهمية الموضعية

# ═══ V8: حقل التدفق السببي — استدلال منطقي مستمر ═══
causal_flow:
  strength: 1.0               # شدة تيار التدفق (γ)
  transitive_depth: 3         # عمق الاستدلال التعددي

# ═══ V8.8: تبريد محاكى (Simulated Annealing) ═══
annealing:
  tau_max: 2.5                # حرارة البدء — استكشاف عالٍ في البداية
  tau_min: 0.15               # حرارة النهاية — تبلور حتمي في النهاية
  tau_decay: 5.0              # ثابت الاضمحلال — كلما زاد، كان التبريد أبطأ

# ═══ V8.8: حقل قيود Dirichlet — prompt boundary conditions ═══
prompt_constraint:
  k_spring: 3.0               # ثابت النابض — قوة الربط بالعقدة المستهدفة
  damping: 0.15               # تخميد النابض مع البعد

# ═══ V8.8: ذاكرة هولوغرافية معرفية (Holographic KB) ═══
holographic_kb:
  enabled: true               # تفعيل الذاكرة الهولوغرافية
  max_facts: 500              # أقصى عدد حقائق للتخزين
  curated_path: "data/facts_expanded.json"  # مسار ملف الحقائق المنسقة

# ═══ V8.8: مسبب تكامل مساري (Path Integral Reasoner) ═══
goal_gravity_weight: 0.3     # وزن جاذبية الهدف (λ) — 0.3 معتدل، 0.5 قوي، 0.1 ضعيف

kb_influence: 0.4            # وزن تأثير القاعدة المعرفية في التوليد العادي (0-1)

reasoning:
  beam_width: 10              # عرض شعاع الاستدلال
  max_depth: 8                # أقصى عمق استدلالي
  min_depth: 2                # أدنى عدد خطوات قبل التحقق من التقارب
  convergence_threshold: 0.75 # عتبة تشابه الهدف للتقارب
